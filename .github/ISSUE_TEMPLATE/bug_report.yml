name: Bug report
description: Something is broken in pi-essentials
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Do not include secrets, tokens, or `.env` contents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install pi-essentials
        2. Call tool ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: output of `pi --version`
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact credentials before pasting.
      render: text
